// ============================================================
// 1. utils — RK4, Gaussian elimination, Plot
// ============================================================

// One RK4 step for y' = f(t, y); y is a plain numeric array.
function rk4Step(f, t, y, h){
  const k1 = f(t, y);
  const k2 = f(t + h/2, y.map((v,i)=>v + h/2*k1[i]));
  const k3 = f(t + h/2, y.map((v,i)=>v + h/2*k2[i]));
  const k4 = f(t + h,   y.map((v,i)=>v + h*k3[i]));
  return y.map((v,i)=>v + h/6*(k1[i] + 2*k2[i] + 2*k3[i] + k4[i]));
}

// Integrate from t=0 to tEnd with n steps; returns {t:[], y:[[...]]} samples.
function integrate(f, y0, tEnd, n){
  const h = tEnd/n, ts = [0], ys = [y0.slice()];
  let y = y0.slice();
  for(let i=1;i<=n;i++){
    y = rk4Step(f, (i-1)*h, y, h);
    ts.push(i*h); ys.push(y.slice());
  }
  return {t:ts, y:ys};
}

// Solve Ax = b by Gaussian elimination with partial pivoting.
function gaussSolve(A, b){
  const n = b.length, M = A.map((row,i)=>[...row, b[i]]);
  for(let c=0;c<n;c++){
    let p = c;
    for(let r=c+1;r<n;r++) if(Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c],M[p]] = [M[p],M[c]];
    for(let r=c+1;r<n;r++){
      const fac = M[r][c]/M[c][c];
      for(let k=c;k<=n;k++) M[r][k] -= fac*M[c][k];
    }
  }
  const x = new Array(n).fill(0);
  for(let r=n-1;r>=0;r--){
    let s = M[r][n];
    for(let k=r+1;k<n;k++) s -= M[r][k]*x[k];
    x[r] = s/M[r][r];
  }
  return x;
}

// Lightweight canvas line plotter.
// traces: [{x:[], y:[], color, label, width}]
class Plot {
  constructor(canvas, opts={}){
    this.cv = canvas; this.ctx = canvas.getContext('2d');
    this.opts = Object.assign({xlabel:'t', ylabel:'', pad:42}, opts);
  }
  draw(traces){
    const {ctx, cv} = this, P = this.opts.pad;
    const W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;
    for(const tr of traces) for(let i=0;i<tr.x.length;i++){
      const x=tr.x[i], y=tr.y[i];
      if(x<xmin)xmin=x; if(x>xmax)xmax=x;
      if(y<ymin)ymin=y; if(y>ymax)ymax=y;
    }
    if(!isFinite(xmin)) return;
    if(ymax-ymin < 1e-12){ ymax+=1; ymin-=1; }
    const yr = ymax-ymin; ymax += yr*0.08; ymin -= yr*0.08;
    const sx = x => P + (x-xmin)/(xmax-xmin)*(W-P-12);
    const sy = y => H-P + (y-ymin)/(ymax-ymin)*(P+28-H);
    // grid + axes
    ctx.strokeStyle = '#222a36'; ctx.fillStyle = '#8b97a8';
    ctx.font = '11px ui-monospace,Consolas,monospace'; ctx.lineWidth = 1;
    const fmt = v => Math.abs(v)>=1000||((Math.abs(v)<0.01)&&v!==0) ? v.toExponential(1) : +v.toPrecision(3);
    for(let i=0;i<=4;i++){
      const yv = ymin + (ymax-ymin)*i/4, gy = sy(yv);
      ctx.beginPath(); ctx.moveTo(P,gy); ctx.lineTo(W-12,gy); ctx.stroke();
      ctx.fillText(fmt(yv), 4, gy+4);
    }
    for(let i=0;i<=5;i++){
      const xv = xmin + (xmax-xmin)*i/5, gx = sx(xv);
      ctx.beginPath(); ctx.moveTo(gx,28); ctx.lineTo(gx,H-P); ctx.stroke();
      ctx.fillText(fmt(xv), gx-12, H-P+16);
    }
    // zero line
    if(ymin<0 && ymax>0){
      ctx.strokeStyle='#3a4450'; ctx.beginPath();
      ctx.moveTo(P,sy(0)); ctx.lineTo(W-12,sy(0)); ctx.stroke();
    }
    // traces
    for(const tr of traces){
      ctx.strokeStyle = tr.color; ctx.lineWidth = tr.width||2;
      ctx.beginPath();
      for(let i=0;i<tr.x.length;i++){
        const px=sx(tr.x[i]), py=sy(tr.y[i]);
        i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.stroke();
    }
    // legend
    let lx = P+8;
    for(const tr of traces){
      if(!tr.label) continue;
      ctx.fillStyle = tr.color; ctx.fillRect(lx, 10, 18, 3);
      ctx.fillStyle = '#dbe2ec'; ctx.fillText(tr.label, lx+24, 16);
      lx += 24 + ctx.measureText(tr.label).width + 26;
    }
    // x label
    ctx.fillStyle='#8b97a8'; ctx.fillText(this.opts.xlabel, W-30, H-6);
  }
}

// engineering notation for slider readouts
function eng(v, unit){
  const pre = [[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
  for(const [m,p] of pre) if(Math.abs(v) >= m*0.9995) return +(v/m).toPrecision(3) + ' ' + p + unit;
  return v.toExponential(2) + ' ' + unit;
}

// log-scale slider helper: range input 0..1000 ↔ [lo, hi] logarithmic
function logVal(t, lo, hi){ return lo*Math.pow(hi/lo, t/1000); }
function makeSlider(parent, {label, lo, hi, init, unit, oninput}){
  const row = document.createElement('div'); row.className = 'ctl';
  const t0 = Math.round(1000*Math.log(init/lo)/Math.log(hi/lo));
  row.innerHTML = `<div class="top"><label>${label}</label><span class="val"></span></div><input type="range" min="0" max="1000" value="${t0}">`;
  parent.appendChild(row);
  const inp = row.querySelector('input'), val = row.querySelector('.val');
  const get = () => logVal(+inp.value, lo, hi);
  const upd = () => { val.textContent = eng(get(), unit); };
  inp.addEventListener('input', ()=>{ upd(); oninput(get()); });
  upd();
  return {get, set:(v)=>{ inp.value = Math.round(1000*Math.log(v/lo)/Math.log(hi/lo)); upd(); }};
}

// ---- self-tests (run with ?test=1) ----
const SELFTESTS = [];
function selftest(name, fn){ SELFTESTS.push({name, fn}); }

selftest('rk4 RC charging matches 1-e^-1 at t=tau', ()=>{
  const tau = 1, r = integrate((t,[v])=>[(1-v)/tau], [0], tau, 1000);
  const v = r.y[r.y.length-1][0];
  return Math.abs(v - (1 - Math.E**-1)) < 1e-6;
});
selftest('rk4 undamped LC conserves energy over 10 cycles', ()=>{
  const L=1, C=1, w = 1/Math.sqrt(L*C);            // y=[q, i]
  const f = (t,[q,i]) => [i, -q/(L*C)];
  const r = integrate(f, [1,0], 10*2*Math.PI/w, 20000);
  const E = ([q,i]) => q*q/(2*C) + L*i*i/2;
  return Math.abs(E(r.y[r.y.length-1]) - E(r.y[0])) < 1e-6;
});
selftest('gaussSolve solves known 2x2 system', ()=>{
  const x = gaussSolve([[2,1],[1,3]],[5,10]);
  return Math.abs(x[0]-1) < 1e-12 && Math.abs(x[1]-3) < 1e-12;
});

function runSelfTests(){
  let pass = 0;
  for(const {name, fn} of SELFTESTS){
    let ok = false;
    try { ok = fn(); } catch(e){ console.error('SELFTEST ERROR', name, e); }
    console.log((ok ? 'SELFTEST PASS' : 'SELFTEST FAIL') + ': ' + name);
    if(ok) pass++;
  }
  console.log(`SELFTEST SUMMARY: ${pass}/${SELFTESTS.length} passed`);
}

const svg = document.getElementById('graph');
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  (parent||svg).appendChild(e); return e;
}
function nodeById(id){ return NODES.find(n=>n.id===id); }
function anchor(n, other){
  // pick a connection point on node n facing node other
  const cx = n.x + n.w/2, cy = n.y + NODE_H/2;
  const ox = other.x + other.w/2, oy = other.y + NODE_H/2;
  if(Math.abs(oy-cy) > 30 && Math.abs(ox-cx) < 120)
    return [cx + (ox>cx?28:(ox<cx?-28:0)), oy>cy ? n.y+NODE_H : n.y];
  return [ox>cx ? n.x+n.w : n.x, cy];
}

function renderGraph(){
  svg.innerHTML = '';
  const defs = el('defs', {});
  const mk = el('marker', {id:'arr', viewBox:'0 0 10 10', refX:9, refY:5,
    markerWidth:7, markerHeight:7, orient:'auto-start-reverse'}, defs);
  el('path', {d:'M0,0 L10,5 L0,10 z', fill:'#566175'}, mk);

  // track headers
  const lbl = (t,x,y)=>{ const e=el('text',{x,y,class:'glabel'}); e.textContent=t; };
  lbl('MATH — THE LANGUAGE', 8, 20);
  lbl('PHYSICS — THE CONTENT', 176, 20);
  lbl('EE COURSE CHAIN', 90, 326);

  for(const ed of EDGES){
    const a = nodeById(ed.from), b = nodeById(ed.to);
    const [x1,y1] = anchor(a,b), [x2,y2] = anchor(b,a);
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    const path = el('path', {
      d:`M${x1},${y1} Q${mx},${y1===a.y+NODE_H/2 ? y1 : my} ${x2},${y2}`,
      class:'gedge', 'marker-end':'url(#arr)', 'data-view':ed.view||''});
    if(ed.view) path.addEventListener('click', ()=>show(ed.view));
    else path.style.cursor = 'default';
  }
  for(const n of NODES){
    const g = el('g', {class:`gnode ${n.track}`, 'data-id':n.id, 'data-view':n.view});
    el('rect', {x:n.x, y:n.y, width:n.w, height:NODE_H, rx:7}, g);
    const t = el('text', {x:n.x+n.w/2, y:n.y+NODE_H/2+4.5, 'text-anchor':'middle'}, g);
    t.textContent = n.label;
    g.addEventListener('click', ()=>show(n.view));
  }
}

let currentView = null;
let viewEpoch = 0;   // bumped on every navigation; running animations check it and stop
function show(viewId){
  if(!viewId) return;
  currentView = viewId; viewEpoch++;
  // highlight graph
  svg.querySelectorAll('.gnode').forEach(g =>
    g.classList.toggle('active', g.dataset.view === viewId));
  svg.querySelectorAll('.gedge').forEach(p =>
    p.classList.toggle('active', p.dataset.view === viewId));
  // render panel
  const root = document.getElementById('sim-root');
  root.innerHTML = '';
  const sim = SIMS[viewId];
  if(sim){
    const h = document.createElement('h2'); h.textContent = sim.title; root.appendChild(h);
    if(sim.why){ const w = document.createElement('div'); w.className='why'; w.innerHTML = sim.why; root.appendChild(w); }
    sim.mount(root);
  } else if(INFOS[viewId]){
    const info = INFOS[viewId];
    const h = document.createElement('h2'); h.textContent = info.title; root.appendChild(h);
    const d = document.createElement('div'); d.innerHTML = info.html; root.appendChild(d);
  }
  document.getElementById('main').scrollTop = 0;
}

// ---------- 4a. RC / RLC transients ----------
// Series RLC step response, state y = [vC, iL]:
//   vC' = i/C ;  i' = (Vs - vC - R·i)/L        (KVL written as an ODE)
function rlcDeriv(R, L, C, Vs){ return (t,[v,i]) => [i/C, (Vs - v - R*i)/L]; }
// RC: vC' = (Vs - vC)/(RC)
function rcDeriv(R, C, Vs){ return (t,[v]) => [(Vs - v)/(R*C)]; }

function rlcZeta(R,L,C){ return (R/2)*Math.sqrt(C/L); }
function classifyZeta(z){
  if(Math.abs(z-1) < 0.02) return 'critically damped';
  return z < 1 ? 'underdamped' : 'overdamped';
}

// Exact step response of series RLC (vC across C, i through loop).
// Closed form is used for plotting because large ζ makes the ODE stiff
// (fast pole ≈ 2ζω₀ blows past RK4's stability limit at plot step sizes).
function rlcStep(R, L, C, Vs, t){
  const w0 = 1/Math.sqrt(L*C), z = rlcZeta(R,L,C);
  if(Math.abs(z-1) < 1e-6){               // critically damped
    const e = Math.exp(-w0*t);
    return [Vs*(1 - e*(1 + w0*t)), (Vs/L)*t*e];
  }
  if(z < 1){                              // underdamped
    const s = z*w0, wd = w0*Math.sqrt(1-z*z), e = Math.exp(-s*t);
    return [Vs*(1 - e*(Math.cos(wd*t) + s/wd*Math.sin(wd*t))),
            (Vs/(L*wd))*e*Math.sin(wd*t)];
  }
  const q = w0*Math.sqrt(z*z-1);          // overdamped: real poles s1, s2
  const s1 = -z*w0 + q, s2 = -z*w0 - q;
  return [Vs*(1 - (s2*Math.exp(s1*t) - s1*Math.exp(s2*t))/(s2-s1)),
          (Vs/(L*(s1-s2)))*(Math.exp(s1*t) - Math.exp(s2*t))];
}

SIMS.rlc = {
  title: 'Transients — every L/C circuit is an ODE',
  why: `<b>Calculus → Diff Eq → Circuits.</b> The component laws ARE derivatives — <b>i = C dv/dt</b>,
    <b>v = L di/dt</b> — so the moment a capacitor or inductor enters a circuit, KVL stops being algebra
    and becomes a differential equation. One storage element → first-order (RC charging, filters);
    two → second-order (RLC ringing, resonance). The damping ratio ζ you set below is the same number
    that becomes pole locations in Signals (350) and Control (480).
    <span class="pages">Wiki: Calculus in Electrical Engineering · Differential Equations in Electrical Engineering</span>`,
  mount(root){
    const Vs = 5;

    const seg = document.createElement('div'); seg.className = 'row';

          <span class="hl">(${eng(R*C,'s')})</span>·dv/dt + v = ${Vs} &nbsp;
          <span class="dim">solution: v(t) = ${Vs}(1 − e<sup>−t/τ</sup>)</span>`;
        chips.innerHTML = `<span class="chip">τ = RC = <b>${eng(tau,'s')}</b></span>
          <span class="chip">v(τ) = 63.2% of Vs</span><span class="chip">~settled at 5τ = <b>${eng(5*tau,'s')}</b></span>`;
        note.textContent = 'The capacitor charges along the universal exponential — same curve as heating, RC filters, and first-order everything. Green: capacitor voltage. Orange: resistor drop (they always sum to Vs).';
      } else {
        const w0 = 1/Math.sqrt(L*C), z = rlcZeta(R,L,C);
        const slowRate = z < 1 ? z*w0 : w0*(z - Math.sqrt(z*z-1));
        const tEnd = z < 1 ? Math.min(8/Math.max(slowRate,1e-9), 80/w0) : 8/slowRate;
        const N = 1500, ts = [], vs = [], is = [];
        for(let k=0;k<=N;k++){
          const t = tEnd*k/N, [v,i] = rlcStep(R,L,C,Vs,t);
          ts.push(t); vs.push(v); is.push(i);
        }
        const Z0 = Math.sqrt(L/C);
        plot.draw([
          {x:ts, y:vs, color:'#7ce38b', label:'v_C (V)'},
          {x:ts, y:is.map(i=>i*Z0), color:'#ffb454', label:'i × Z₀ (V)'},
        ]);
        eq.innerHTML = `LC·d²v/dt² + RC·dv/dt + v = Vs &nbsp;&nbsp;<span class="dim">→</span>&nbsp;
          <span class="hl">(${eng(L*C,'s²')})</span>·v″ + <span class="hl">(${eng(R*C,'s')})</span>·v′ + v = ${Vs}`;
        const cls = classifyZeta(z);
        chips.innerHTML = `<span class="chip">ω₀ = 1/√(LC) = <b>${eng(w0,'rad/s')}</b></span>
          <span class="chip">f₀ = <b>${eng(w0/(2*Math.PI),'Hz')}</b></span>
          <span class="chip">ζ = (R/2)√(C/L) = <b>${z.toPrecision(3)}</b></span>

// ---------- 4b. mass-spring ↔ RLC analogy ----------
// Identical second-order ODEs:  m·x″ + b·x′ + k·x = 0   and   L·q″ + R·q′ + q/C = 0
// with m↔L, b↔R, k↔1/C, x↔q, x′↔i.
function msdDeriv(m, b, k){ return (t,[x,v]) => [v, (-k*x - b*v)/m]; }

function analogySolve(m, b, k){
  const w0 = Math.sqrt(k/m), z = b/(2*Math.sqrt(k*m));
  const slowRate = z < 1 ? Math.max(z*w0, 1e-9) : w0*(z - Math.sqrt(z*z-1));
  const tEnd = Math.min(8/slowRate, 60/w0);
  const n = Math.min(20000, Math.max(2000, Math.ceil(1.5*tEnd*b/m)));  // keep h·(fast pole) stable
  const mech = integrate(msdDeriv(m,b,k), [1,0], tEnd, n);             // x₀=1, released
  const elec = integrate(msdDeriv(m,b,k), [1,0], tEnd, n);             // SAME equation: L=m, R=b, 1/C=k
  return {mech, elec, tEnd, n, w0, z};
}

SIMS.analogy = {
  title: 'Mechanics is the rehearsal — same ODE, different costume',
  why: `<b>Physics 1 → Circuits.</b> A mass on a damped spring and a series RLC circuit obey the
    <b>same second-order differential equation</b> — mass↔inductance (inertia), damping↔resistance
    (dissipation), spring stiffness↔1/capacitance (restoring), position↔charge, velocity↔current.
    Every slider below moves <i>both</i> systems at once, and their responses plot as one curve —
    because mathematically there is only one system. Learning oscillation on blocks and springs IS
    learning circuit transients in disguise.
    <span class="pages">Wiki: Classical Mechanics in Electrical Engineering</span>`,
  mount(root){
    const eq = document.createElement('div'); eq.className = 'eq'; root.appendChild(eq);
    const ctls = document.createElement('div'); ctls.className = 'controls'; root.appendChild(ctls);
    const chips = document.createElement('div'); chips.className = 'chips'; root.appendChild(chips);
    const row = document.createElement('div'); row.className = 'row'; root.appendChild(row);
    const cvM = document.createElement('canvas'); cvM.width = 380; cvM.height = 190; row.appendChild(cvM);
    const cvE = document.createElement('canvas'); cvE.width = 380; cvE.height = 190; row.appendChild(cvE);
    const cvP = document.createElement('canvas'); cvP.width = 780; cvP.height = 280; root.appendChild(cvP);
    const note = document.createElement('p'); note.className = 'note';
    note.textContent = 'Watch the mass and the capacitor charge move in lockstep. The thick green band is x(t); the thin pink line riding exactly inside it is q(t) — they differ by nothing.';
    root.appendChild(note);
    const plot = new Plot(cvP, {xlabel:'t (s)'});

    let sol = null, sm, sb, sk;
    const update = () => {
      const m = sm.get(), b = sb.get(), k = sk.get();
      sol = analogySolve(m,b,k);
      eq.innerHTML =
        `<span style="color:#ffb454">m</span>·x″ + <span style="color:#ffb454">b</span>·x′ + <span style="color:#ffb454">k</span>·x = 0
         &nbsp;&nbsp;<span class="dim">⟺</span>&nbsp;&nbsp;
         <span style="color:#7ce38b">L</span>·q″ + <span style="color:#7ce38b">R</span>·q′ + <span style="color:#7ce38b">(1/C)</span>·q = 0
         <br><span class="dim">m=${m.toPrecision(3)} ↔ L=${m.toPrecision(3)}&nbsp;&nbsp;·&nbsp;&nbsp;b=${b.toPrecision(3)} ↔ R=${b.toPrecision(3)}&nbsp;&nbsp;·&nbsp;&nbsp;k=${k.toPrecision(3)} ↔ 1/C=${k.toPrecision(3)}</span>`;
      const cls = classifyZeta(sol.z);
      chips.innerHTML = `<span class="chip">ω₀ = √(k/m) = 1/√(LC) = <b>${sol.w0.toPrecision(3)} rad/s</b></span>
        <span class="chip">ζ = <b>${sol.z.toPrecision(3)}</b></span>
        <span class="chip cls-${cls[0]==='u'?'under':(cls[0]==='c'?'crit':'over')}">→ <b>${cls}</b></span>`;
      plot.draw([
        {x:sol.mech.t, y:sol.mech.y.map(s=>s[0]), color:'#7ce38b66', label:'x(t) — mass position', width:7},
        {x:sol.elec.t, y:sol.elec.y.map(s=>s[0]), color:'#ff6e9c', label:'q(t) — capacitor charge', width:1.6},
      ]);
    };
    const mk = (label,lo,hi,init,unit) => makeSlider(ctls, {label, lo, hi, init, unit, oninput:update});
    sm = mk('m ↔ L', 0.1, 5, 1, 'kg ↔ H');
    sb = mk('b ↔ R', 0.05, 10, 0.4, 'N·s/m ↔ Ω');
    sk = mk('k ↔ 1/C', 1, 50, 9, 'N/m ↔ 1/F');
    update();

    // --- animations ---
    const myEpoch = viewEpoch;
    const mctx = cvM.getContext('2d'), ectx = cvE.getContext('2d');
    let dotP = 0, lastTs = null;
    function drawMech(x){
      const W = cvM.width, H = cvM.height; mctx.clearRect(0,0,W,H);
      const wallX = 26, eqX = 215, px = eqX + x*95, midY = H/2;
      mctx.fillStyle = '#8b97a8'; mctx.font = '12px system-ui';
      mctx.fillText('MECHANICAL', 12, 20);
      mctx.strokeStyle = '#566175'; mctx.lineWidth = 3;
      mctx.beginPath(); mctx.moveTo(wallX, 28); mctx.lineTo(wallX, H-28); mctx.stroke();
      // spring zigzag wall → mass
      mctx.strokeStyle = '#ffb454'; mctx.lineWidth = 2; mctx.beginPath();
      mctx.moveTo(wallX, midY-18);
      const nCoil = 9, span = (px-24) - wallX;
      for(let i=1;i<=nCoil;i++)
        mctx.lineTo(wallX + span*i/nCoil, midY-18 + (i%2 ? -10 : 10));
      mctx.lineTo(px-24, midY-18); mctx.stroke();
      // damper (piston) wall → mass, lower line
      mctx.strokeStyle = '#5aa9ff'; mctx.beginPath();
      mctx.moveTo(wallX, midY+22); mctx.lineTo(wallX+span*0.45, midY+22);
      mctx.rect(wallX+span*0.45, midY+14, 26, 16);
      mctx.moveTo(wallX+span*0.45+13, midY+22); mctx.lineTo(px-24, midY+22);
      mctx.stroke();
      // mass
      mctx.fillStyle = '#dbe2ec'; mctx.fillRect(px-24, midY-30, 48, 60);
      mctx.fillStyle = '#0e1116'; mctx.font = 'bold 15px system-ui';
      mctx.fillText('m', px-7, midY+5);
      // equilibrium tick
      mctx.strokeStyle = '#3a4450'; mctx.setLineDash([3,4]);
      mctx.beginPath(); mctx.moveTo(eqX, 30); mctx.lineTo(eqX, H-22); mctx.stroke();
      mctx.setLineDash([]);
    }
    function drawElec(q, i){
      const W = cvE.width, H = cvE.height; ectx.clearRect(0,0,W,H);
      const L0 = 40, R0 = W-46, T0 = 44, B0 = H-34;
      ectx.fillStyle = '#8b97a8'; ectx.font = '12px system-ui';
      ectx.fillText('ELECTRICAL — series RLC', 12, 20);
      ectx.strokeStyle = '#566175'; ectx.lineWidth = 2;
      ectx.strokeRect(L0, T0, R0-L0, B0-T0);
      // R zigzag (top)
      const rx = (L0+R0)/2 - 38; ectx.strokeStyle = '#5aa9ff'; ectx.beginPath();
      ectx.moveTo(rx, T0);
      for(let s=1;s<=6;s++) ectx.lineTo(rx + s*12, T0 + (s%2 ? -9 : 9));
      ectx.lineTo(rx+76, T0); ectx.stroke();
      ectx.fillStyle = '#5aa9ff'; ectx.fillText('R (damping)', rx+2, T0-16);
      // L coil (right side)
      ectx.strokeStyle = '#ffb454'; ectx.beginPath();
      const ly = (T0+B0)/2 - 34;
      for(let s=0;s<4;s++) ectx.arc(R0, ly + s*18 + 9, 9, -Math.PI/2, Math.PI/2);
      ectx.stroke();
      ectx.fillStyle = '#ffb454'; ectx.fillText('L (mass)', R0-66, (T0+B0)/2+4);
      // C plates (bottom) with charge bars
      const cx = (L0+R0)/2; ectx.strokeStyle = '#7ce38b'; ectx.lineWidth = 3;
      ectx.beginPath(); ectx.moveTo(cx-10, B0-14); ectx.lineTo(cx-10, B0+14);
      ectx.moveTo(cx+10, B0-14); ectx.lineTo(cx+10, B0+14); ectx.stroke();
      // clear the loop wire between plates
      ectx.strokeStyle = '#0e1116'; ectx.lineWidth = 4;
      ectx.beginPath(); ectx.moveTo(cx-9, B0); ectx.lineTo(cx+9, B0); ectx.stroke();
      ectx.fillStyle = '#7ce38b';
      ectx.fillText('C (spring)  q=' + q.toFixed(2), cx-30, B0+28);
      // charge fill: bar height ∝ |q|
      const qb = 14*Math.min(Math.abs(q), 1.2);
      ectx.fillStyle = q >= 0 ? '#7ce38b' : '#ff6e9c';
      ectx.fillRect(cx-16, B0-qb, 4, 2*qb);
      // current dot orbiting the loop, speed ∝ i
      const per = 2*((R0-L0)+(B0-T0));
      dotP = ((dotP + i*0.045) % 1 + 1) % 1;
      let d = dotP*per, dx, dy;
      if(d < R0-L0){ dx = L0+d; dy = T0; }
      else if(d < (R0-L0)+(B0-T0)){ dx = R0; dy = T0 + (d-(R0-L0)); }
      else if(d < 2*(R0-L0)+(B0-T0)){ dx = R0 - (d-(R0-L0)-(B0-T0)); dy = B0; }
      else { dx = L0; dy = B0 - (d-2*(R0-L0)-(B0-T0)); }
      ectx.fillStyle = '#ff6e9c';
      ectx.beginPath(); ectx.arc(dx, dy, 5, 0, 7); ectx.fill();
      ectx.fillStyle = '#8b97a8';
      ectx.fillText('i = ' + i.toFixed(2), L0+6, T0+20);
    }
    function frame(ts){
      if(viewEpoch !== myEpoch) return;          // view changed — stop
      if(lastTs === null) lastTs = ts;
      const wall = 9000;                          // ms per loop of the solution window
      const tt = (ts % wall)/wall;
      const idx = Math.min(sol.mech.t.length-1, Math.floor(tt*sol.mech.t.length));
      const [x,v] = sol.mech.y[idx];
      drawMech(x); drawElec(x, v);                // q ≡ x, i ≡ x′ by the analogy
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
};

selftest('analogy: mapped mechanical and electrical responses coincide', ()=>{
  const {mech, elec} = analogySolve(1.3, 0.7, 12);
  let maxd = 0;
  for(let i=0;i<mech.y.length;i++) maxd = Math.max(maxd, Math.abs(mech.y[i][0]-elec.y[i][0]));
  return maxd < 1e-12;
});

selftest('RC sim hits 63.2% of Vs at t=tau', ()=>{
  const R=1000, C=1e-6, Vs=5, tau=R*C;
  const r = integrate(rcDeriv(R,C,Vs), [0], tau, 2000);
  return Math.abs(r.y[r.y.length-1][0] - Vs*(1-Math.E**-1)) < 1e-4*Vs;
});
selftest('analytic RLC step matches RK4 in non-stiff case', ()=>{
  const R=100, L=0.1, C=1e-5, Vs=5;          // ζ=0.5, ω₀=1000 — comfortably non-stiff
  const tEnd = 0.02, n = 4000;
  const r = integrate(rlcDeriv(R,L,C,Vs), [0,0], tEnd, n);
  let maxErr = 0;
  for(let k=0;k<=n;k+=40){
    const [v,i] = rlcStep(R,L,C,Vs,r.t[k]);
    maxErr = Math.max(maxErr, Math.abs(v-r.y[k][0]), Math.abs(i-r.y[k][1])*Math.sqrt(L/C));
  }
  return maxErr < 1e-6;
});
selftest('RLC critical damping at R = 2*sqrt(L/C)', ()=>{
  const L=0.1, C=1e-5, R = 2*Math.sqrt(L/C);
  return classifyZeta(rlcZeta(R,L,C)) === 'critically damped'
      && classifyZeta(rlcZeta(R/4,L,C)) === 'underdamped'
      && classifyZeta(rlcZeta(R*4,L,C)) === 'overdamped';
});
