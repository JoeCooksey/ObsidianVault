                - group "What is electrical engineering?" [ref=f98e512]:
                  - generic [ref=f98e513]: Electrical engineering is the design, production, analysis, and testing of different electronic circuits and systems. This includes computers and personal electronics, such as cell phones and tablets. It also includes the electronics underlying household equipment, such as microwaves and refrigerators. In addition, the electrical components of cars and airplanes are also designed through electrical engineering. Power engineering, a branch of electrical engineering, includes the design, development, and troubleshooting of systems used to generate and distribute electricity for industrial and residential use.
