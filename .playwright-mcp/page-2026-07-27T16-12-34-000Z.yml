          - generic [ref=f66e498]:
            - heading "Learn more about Embedded Systems" [level=2] [ref=f66e499]
            - paragraph [ref=f66e500]: Embedded systems are used to facilitate work automation in agriculture and manufacturing, while also enabling complex graphical user interfaces like LED and touch screens. Embedded systems are everywhere, from home thermostats to work environments.
          - generic [ref=f66e501]:
            - generic [ref=f66e502]: Frequently asked questions
            - generic [ref=f66e503]:
              - generic [ref=f66e504]:
                - heading [level=3] [ref=f66e506] [cursor=pointer]:
                  - button "What is an embedded system?" [expanded] [ref=f66e507]
                - group "What is an embedded system?" [ref=f66e512]:
                  - generic [ref=f66e513]: An embedded system is an electronic computer circuit that includes a central processing unit with computer code that handles a specific task within a larger, functional system. Embedded systems typically run on microprocessors and microcontrollers. They can take input from peripheral devices that sense or detect changes in external situations that influence their function. For example, an embedded system can regulate temperature for a central heating system. Unlike a standard computer, which has many general uses, embedded systems are specialized, making them more effective and efficient for their designed task.
              - heading [level=3] [ref=f66e517] [cursor=pointer]:
                - button "What careers use embedded systems?" [ref=f66e518]
              - heading [level=3] [ref=f66e524] [cursor=pointer]:
                - button "What are some of the common characteristics of embedded systems?" [ref=f66e525]
